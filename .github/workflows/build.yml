name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew test --no-daemon

  package-linux:
    name: Package Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build DEB and RPM
        run: |
          export RIMALUX_PACKAGING_JDK="$JAVA_HOME"
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rimalux-linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: warn

  package-windows:
    name: Package Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y
        continue-on-error: true
      - name: Run tests on Windows
        shell: pwsh
        run: .\gradlew.bat test --no-daemon
      - name: Build EXE
        shell: pwsh
        run: |
          $env:RIMALUX_PACKAGING_JDK = $env:JAVA_HOME
          .\gradlew.bat :desktopApp:packageExe --no-daemon
      - name: Build MSI
        shell: pwsh
        continue-on-error: true
        run: |
          $env:RIMALUX_PACKAGING_JDK = $env:JAVA_HOME
          .\gradlew.bat :desktopApp:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rimalux-windows
          path: |
            desktopApp/build/compose/binaries/main/exe/*.exe
            desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn
