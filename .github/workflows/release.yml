name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version, test, and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      date: ${{ steps.next.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Compute next version
        id: next
        run: |
          current=$(sed -n 's/^appVersion=//p' gradle.properties | tail -1)
          current=${current:-0.1.0}
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Commit version bump and create tag
        run: |
          sed -i "s/^appVersion=.*/appVersion=${{ steps.next.outputs.version }}/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: release ${{ steps.next.outputs.tag }}"
          git tag -a "${{ steps.next.outputs.tag }}" -m "Rimalux Desktop ${{ steps.next.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.next.outputs.tag }}"

  linux:
    name: Linux AppImage
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app image
        run: |
          export RIMALUX_PACKAGING_JDK="$JAVA_HOME"
          ./gradlew :desktopApp:createDistributable \
            -PappVersion="${{ needs.prepare.outputs.version }}" --no-daemon
      - name: Package AppImage
        run: |
          set -euo pipefail
          base="rimalux_desktop_${{ needs.prepare.outputs.version }}_${{ needs.prepare.outputs.date }}"
          appdir="AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/256x256/apps" dist

          app_image_dir="$(find desktopApp/build/compose/binaries/main/app -mindepth 1 -maxdepth 1 -type d | head -1)"
          [ -n "$app_image_dir" ] || { echo "jpackage app image not found" >&2; exit 1; }
          cp -a "$app_image_dir/." "$appdir/usr/"
          [ -x "$appdir/usr/bin/Rimalux" ] || {
            echo "Rimalux launcher missing from app image" >&2
            find "$appdir/usr" -maxdepth 2 >&2
            exit 1
          }
          cp desktopApp/packaging/rimalux.png "$appdir/rimalux.png"
          cp desktopApp/packaging/rimalux.png \
            "$appdir/usr/share/icons/hicolor/256x256/apps/rimalux.png"

          cat > "$appdir/rimalux.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Rimalux
          Comment=Procedural OLED wallpaper studio
          Exec=Rimalux
          Icon=rimalux
          Categories=Graphics;
          Terminal=false
          StartupWMClass=Rimalux
          EOF

          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Rimalux" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --no-appstream \
            "$appdir" "dist/$base.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y
        continue-on-error: true
      - name: Build EXE installer
        shell: pwsh
        run: |
          $env:RIMALUX_PACKAGING_JDK = $env:JAVA_HOME
          .\gradlew.bat :desktopApp:packageExe "-PappVersion=${{ needs.prepare.outputs.version }}" --no-daemon
      - name: Rename installer
        shell: pwsh
        run: |
          $base = "rimalux_desktop_${{ needs.prepare.outputs.version }}_${{ needs.prepare.outputs.date }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem desktopApp/build/compose/binaries/main/exe/*.exe |
            Copy-Item -Destination "dist/$base.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [ prepare, linux, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Rimalux Desktop ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.exe
