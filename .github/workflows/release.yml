name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version, test, and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      date: ${{ steps.next.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Compute next version
        id: next
        run: |
          current=$(sed -n 's/^appVersion=//p' gradle.properties | tail -1)
          current=${current:-0.1.0}
          IFS=. read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Commit version bump and create tag
        run: |
          sed -i "s/^appVersion=.*/appVersion=${{ steps.next.outputs.version }}/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: release ${{ steps.next.outputs.tag }}"
          git tag -a "${{ steps.next.outputs.tag }}" -m "Rimalux Desktop ${{ steps.next.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.next.outputs.tag }}"

  linux:
    name: Linux packages
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build DEB and RPM
        run: |
          export RIMALUX_PACKAGING_JDK="$JAVA_HOME"
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm \
            -PappVersion="${{ needs.prepare.outputs.version }}" --no-daemon
      - name: Rename packages
        run: |
          base="rimalux_desktop_${{ needs.prepare.outputs.version }}_${{ needs.prepare.outputs.date }}"
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/deb/*.deb "dist/$base.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "dist/$base.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows installers
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y
        continue-on-error: true
      - name: Build EXE
        shell: pwsh
        run: |
          $env:RIMALUX_PACKAGING_JDK = $env:JAVA_HOME
          .\gradlew.bat :desktopApp:packageExe "-PappVersion=${{ needs.prepare.outputs.version }}" --no-daemon
      - name: Build MSI
        shell: pwsh
        continue-on-error: true
        run: |
          $env:RIMALUX_PACKAGING_JDK = $env:JAVA_HOME
          .\gradlew.bat :desktopApp:packageMsi "-PappVersion=${{ needs.prepare.outputs.version }}" --no-daemon
      - name: Rename installers
        shell: pwsh
        run: |
          $base = "rimalux_desktop_${{ needs.prepare.outputs.version }}_${{ needs.prepare.outputs.date }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem desktopApp/build/compose/binaries/main/exe/*.exe | Copy-Item -Destination "dist/$base.exe"
          if (Test-Path desktopApp/build/compose/binaries/main/msi) {
            Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi -ErrorAction SilentlyContinue |
              Copy-Item -Destination "dist/$base.msi"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [ prepare, linux, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Rimalux Desktop ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/**/*
